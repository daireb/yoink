# Yoink — self-hosted Spotify/YouTube download portal.
#
#   docker compose up -d                     ->  http://localhost:8080
#   docker compose --profile tunnel up -d    ->  same, plus Cloudflare Tunnel
#   ./update.sh                              ->  pull the newest image, restart
#
# Works with no .env at all: downloads live in a Docker volume and you fetch
# them through the UI. To land them in a host folder instead, set
# YOINK_DOWNLOADS in .env (the folder must be writable by uid 10001).
# The image is rebuilt and published whenever yt-dlp releases; run ./update.sh
# on a schedule and you never think about it. From source: docker build -t
# yoink:local . and set YOINK_IMAGE=yoink:local.
#
# Sandboxing mirrors the usual untrusted-tool posture: non-root, no
# capabilities, read-only rootfs, loopback-only port. Keep the port
# loopback-only and put an identity proxy (Cloudflare Access, Tailscale) in
# front for remote use; only open it to the LAN if you also set YOINK_PASSWORD.

services:
  yoink:
    image: ${YOINK_IMAGE:-ghcr.io/daireb/yoink:latest}
    container_name: yoink
    restart: unless-stopped

    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 1024

    # All settings come from .env — see .env.example for what each one does.
    environment:
      YOINK_PASSWORD: ${YOINK_PASSWORD:-}
      YOINK_THREADS: ${YOINK_THREADS:-4}
      YOINK_KEEP_DAYS: ${YOINK_KEEP_DAYS:-7}
      YOINK_PREFLIGHT_TIMEOUT: ${YOINK_PREFLIGHT_TIMEOUT:-80}
      YOINK_UPDATE_CHECK: ${YOINK_UPDATE_CHECK:-1}
      YOINK_SECRET: ${YOINK_SECRET:-}

    ports:
      - "127.0.0.1:8080:8080"

    volumes:
      # Where finished audio lands (also downloadable through the UI).
      # Default: a Docker volume, so this works with zero setup. Point
      # YOINK_DOWNLOADS at a host folder to keep files on your machine.
      - ${YOINK_DOWNLOADS:-yoink-downloads}:/downloads
      # Job database, logs, tool caches.
      - yoink-data:/data

    tmpfs:
      - /tmp:mode=1777,size=512m

    # Docker's default json-file log is unbounded; spotdl is chatty.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: Cloudflare Tunnel in the same file, so remote access needs no
  # second setup. Get a token in Zero Trust -> Networks -> Tunnels, put it in
  # .env as TUNNEL_TOKEN, then start with:  docker compose --profile tunnel up -d
  # (host networking lets it reach the loopback-only port above)
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: yoink-cloudflared
    restart: unless-stopped
    profiles: [tunnel]
    network_mode: host
    command: tunnel run --token ${TUNNEL_TOKEN:-}
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  yoink-data:
  yoink-downloads:
