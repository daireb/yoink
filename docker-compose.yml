# Yoink — self-hosted Spotify/YouTube download portal.
#
# Quick start:   docker compose up -d --build   ->  http://localhost:8080
#
# Sandboxing mirrors the usual untrusted-tool posture: non-root, no
# capabilities, read-only rootfs, loopback-only port. On a NAS keep the port
# loopback-only and put Cloudflare Tunnel + Access in front (see README);
# only open the port to the LAN if you also set YOINK_PASSWORD.

services:
  yoink:
    build:
      context: .
      args:
        # Bump (e.g. YTDLP_REFRESH=$(date +%s)) to pull the newest yt-dlp
        # without rebuilding everything. See README "Keeping it working".
        YTDLP_REFRESH: ${YTDLP_REFRESH:-0}
    image: yoink:latest
    container_name: yoink
    restart: unless-stopped

    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 1024

    environment:
      # Optional password for the web UI. Leave unset for open access
      # (fine while the port is loopback-only or behind Tailscale/CF Access).
      YOINK_PASSWORD: ${YOINK_PASSWORD:-}
      # Parallel downloads within a spotdl job.
      YOINK_THREADS: "4"

    ports:
      - "127.0.0.1:8080:8080"

    volumes:
      # Where finished audio lands (also downloadable through the UI).
      - ${YOINK_DOWNLOADS:-./downloads}:/downloads
      # Job database, logs, tool caches.
      - yoink-data:/data

    tmpfs:
      - /tmp:mode=1777,size=512m

    # Docker's default json-file log is unbounded; spotdl is chatty.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  yoink-data:
