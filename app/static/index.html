<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reprise</title>
<meta name="theme-color" content="#0f1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reprise">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<style>
  :root {
    --bg: #0f1117; --panel: #171a23; --panel2: #1e2230; --line: #2a2f40;
    --text: #e6e9f2; --dim: #8b91a7; --accent: #7c8cff; --accent2: #5865f2;
    --ok: #4ade80; --warn: #fbbf24; --err: #f87171; --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg); color: var(--text); min-height: 100vh;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom: env(safe-area-inset-bottom);
  }
  body.dragging::after { content: "Drop the CSV to request it"; position: fixed; inset: 0; display: grid; place-items: center; background: rgba(124,140,255,.12); border: 3px dashed var(--accent); color: var(--accent); font-size: 20px; font-weight: 600; z-index: 5; pointer-events: none; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 32px 20px 64px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  header img { width: 32px; height: 32px; }
  header h1 { font-size: 24px; letter-spacing: -0.4px; flex: 1; }
  header .ibtn { margin-right: -7px; }   /* glyph, not hit-box, sits on the column edge */

  svg.i { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; display: block; }
  .ibtn { background: transparent; border: 1px solid transparent; color: var(--dim); border-radius: 9px; padding: 7px; cursor: pointer; display: inline-flex; }
  .ibtn:hover { color: var(--text); background: var(--panel2); filter: none; }
  .ibtn.danger:hover { color: var(--err); }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }

  .field { position: relative; }
  .field input {
    width: 100%; background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    border-radius: 12px; padding: 14px 58px 14px 16px; font-size: 16px; outline: none;
  }
  .field input:focus { border-color: var(--accent); }
  .field .go {
    position: absolute; right: 7px; top: 7px; bottom: 7px; width: 42px; border-radius: 9px;
    background: var(--accent2); color: #fff; border: 0; cursor: pointer; display: grid; place-items: center; padding: 0;
  }
  .field .go:hover { filter: brightness(1.1); }
  .field .go:disabled { opacity: .6; cursor: default; filter: none; }
  .hint { color: var(--dim); font-size: 13px; margin: 12px 16px 0; }
  .hint a { color: var(--accent); text-decoration: none; }
  .hint a:hover { text-decoration: underline; }
  .err { color: var(--err); font-size: 13.5px; margin: 8px 16px 0; }
  .err.soft { color: var(--dim); }

  select, input[type=password] {
    background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; padding: 11px 14px; font-size: 16px; outline: none; width: 100%;
  }
  select:focus, input[type=password]:focus { border-color: var(--accent); }
  button { background: var(--accent2); color: #fff; border: 0; border-radius: 10px; padding: 11px 20px; font-size: 15px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  button:hover { filter: brightness(1.1); }
  button.ghost { background: transparent; color: var(--dim); border: 1px solid var(--line); font-weight: 500; padding: 7px 13px; font-size: 13px; }
  button.ghost:hover { color: var(--text); border-color: var(--dim); filter: none; }
  a.btn { text-decoration: none; display: inline-block; }
  .linkish { background: none; border: 0; color: var(--accent); padding: 0; font-size: inherit; font-weight: 500; cursor: pointer; }
  .linkish:hover { text-decoration: underline; filter: none; }

  .jobs { margin-top: 24px; }
  .job { padding: 0; margin-bottom: 12px; display: flex; align-items: stretch; overflow: hidden; transition: border-color .15s; }
  .job:hover { border-color: #363c52; }
  .cover { width: 112px; flex-shrink: 0; align-self: stretch; background: var(--panel2); object-fit: cover; display: grid; place-items: center; color: var(--dim); border-right: 1px solid var(--line); }
  .cover svg.i { width: 26px; height: 26px; }
  .body { flex: 1; min-width: 0; padding: 16px; }
  .job-head { display: flex; align-items: flex-start; gap: 10px; }
  .job-title { font-weight: 600; overflow-wrap: anywhere; flex: 1; line-height: 1.35; }
  .src { color: var(--dim); flex-shrink: 0; padding: 7px; margin: -7px -7px -7px 0; border-radius: 9px; display: inline-flex; }
  a.src:hover { color: var(--accent); background: var(--panel2); }
  .state { margin-top: 6px; font-size: 14px; color: var(--dim); }
  .state.ok { color: var(--ok); } .state.warn { color: var(--warn); } .state.bad { color: var(--err); }
  .bar { height: 5px; background: var(--panel2); border-radius: 999px; margin: 10px 0 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .5s; }
  .bar.indet i { width: 30% !important; animation: slide 1.2s ease-in-out infinite alternate; }
  @keyframes slide { from { margin-left: 0 } to { margin-left: 70% } }
  .actions { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
  .actions .spacer { flex: 1; }
  .actions .ibtn:last-child { margin-right: -7px; }
  @media (max-width: 480px) { .cover { width: 84px; } .body { padding: 14px; } }
  .missing { margin-top: 10px; font-size: 13.5px; }
  .missing ul { margin: 6px 0 0 18px; color: var(--dim); }

  .empty { text-align: center; color: var(--dim); padding: 40px 0; font-size: 14px; }
  footer { text-align: center; color: var(--dim); font-size: 12.5px; margin-top: 32px; }

  .overlay { position: fixed; inset: 0; background: rgba(15,17,23,.82); display: none; place-items: center; z-index: 10; padding: 18px; backdrop-filter: blur(4px); }
  .overlay.show { display: grid; }
  .overlay.top { z-index: 20; }
  .sheet { padding: 24px; width: min(540px, 100%); display: grid; gap: 12px; max-height: 90vh; overflow: auto; }
  .sheet h2 { font-size: 19px; line-height: 1.3; overflow-wrap: anywhere; }
  .sheet .sub { color: var(--dim); font-size: 14px; }
  .sheet ol { margin: 4px 0 0 20px; color: var(--dim); font-size: 13.5px; max-height: 180px; overflow: auto; }
  .sheet .btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .sheet .sheet-head { display: flex; align-items: flex-start; gap: 10px; }
  .sheet .sheet-head h2 { flex: 1; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; font-size: 14px; }
  .kv dt { color: var(--dim); } .kv dd { overflow-wrap: anywhere; }
  .kv a { color: var(--accent); text-decoration: none; } .kv a:hover { text-decoration: underline; }
  .files { display: grid; gap: 4px; }
  .file { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; padding: 7px 10px; background: var(--panel2); border-radius: 7px; }
  .file a { color: var(--accent); text-decoration: none; overflow-wrap: anywhere; }
  .file a:hover { text-decoration: underline; }
  .file span { color: var(--dim); white-space: nowrap; }
  pre { background: #0b0d12; border: 1px solid var(--line); border-radius: 8px; padding: 12px; font-size: 12px; line-height: 1.45; overflow: auto; max-height: 240px; color: #aab2c8; }
  .optgrid { display: grid; gap: 12px; }
  .opt label { display: block; color: var(--dim); font-size: 12.5px; margin-bottom: 5px; }
  .check { display: flex; align-items: center; gap: 9px; font-size: 14.5px; }
  #loginErr { color: var(--err); font-size: 13px; min-height: 18px; }
  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: rot .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
  .go .spin { border-color: rgba(255,255,255,.35); border-top-color: #fff; margin: 0; }
  @keyframes rot { to { transform: rotate(360deg) } }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3 1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8 1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
  <symbol id="i-spotify" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M6.5 9.6c3.8-1.1 8.1-.8 11.3 1.2M7.3 12.6c3.1-.9 6.6-.6 9.3 1M8.1 15.4c2.4-.7 5.1-.5 7.3.8"/></symbol>
  <symbol id="i-youtube" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="4"/><path d="M10 9.5v5l4.5-2.5z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h5M10 17h5"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M16 16l4 4"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
</svg>

<div class="overlay" id="login"><div class="card sheet" style="width:min(340px,100%)">
  <h2>Reprise</h2>
  <input type="password" id="pw" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
  <div id="loginErr"></div>
  <button onclick="doLogin()">Sign in</button>
</div></div>

<div class="overlay" id="confirm"><div class="card sheet">
  <h2 id="cTitle"></h2>
  <div class="sub" id="cSub"></div>
  <ol id="cTracks"></ol>
  <div class="sub" id="cOpts"></div>
  <div class="btns">
    <button class="ghost" onclick="closeConfirm()">Cancel</button>
    <button onclick="confirmGo()">Request</button>
  </div>
</div></div>

<div class="overlay top" id="options"><div class="card sheet" style="width:min(380px,100%)">
  <div class="sheet-head"><h2>Options</h2><button class="ibtn" onclick="closeOptions()" aria-label="Close"><svg class="i"><use href="#i-x"/></svg></button></div>
  <div class="sub">Defaults for every request. Saved in this browser.</div>
  <div class="optgrid">
    <div class="opt"><label>Quality</label>
      <select id="bitrate">
        <option value="320">Best · 320 kbps</option>
        <option value="192">Compact · 192 kbps</option>
        <option value="128">Smallest · 128 kbps</option>
      </select></div>
    <div class="opt"><label>Format</label>
      <select id="format">
        <option value="mp3">MP3</option><option value="m4a">M4A</option><option value="opus">Opus</option><option value="flac">FLAC</option>
      </select></div>
    <label class="check"><input type="checkbox" id="numbered"> Number tracks in playlist order <span class="sub">(keeps order on simple players)</span></label>
  </div>
  <div class="btns"><button onclick="closeOptions()">Done</button></div>
</div></div>

<div class="overlay" id="details"><div class="card sheet">
  <div class="sheet-head"><h2 id="dTitle"></h2><button class="ibtn" onclick="closeDetails()" aria-label="Close"><svg class="i"><use href="#i-x"/></svg></button></div>
  <dl class="kv" id="dMeta"></dl>
  <div class="files" id="dFiles"></div>
  <pre id="dLog"></pre>
</div></div>

<div class="wrap">
  <header>
    <img src="/static/icon-header.png" alt="">
    <h1>Reprise</h1>
    <button class="ibtn" onclick="openOptions()" aria-label="Options" title="Options"><svg class="i"><use href="#i-gear"/></svg></button>
  </header>

  <div class="field">
    <input type="text" id="input" placeholder="Paste a Spotify or YouTube link, or search…"
           autocomplete="off" autocapitalize="off" onkeydown="if(event.key==='Enter')submit()">
    <button class="go" id="goBtn" onclick="submit()" aria-label="Request"><svg class="i"><use href="#i-arrow"/></svg></button>
  </div>
  <div class="hint">Private playlist or Liked Songs? Export it at <a href="https://exportify.net" target="_blank" rel="noopener">exportify.net</a>, then drop the CSV anywhere on this page, or <a href="#" onclick="event.preventDefault();$('csvfile').click()">choose a file</a>.</div>
  <div class="err" id="subErr"></div>
  <input type="file" id="csvfile" accept=".csv,text/csv" style="display:none">

  <div class="jobs" id="jobs"></div>
  <footer id="foot"></footer>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mb = (b) => b >= 1e9 ? (b/1e9).toFixed(2)+' GB' : b >= 1e6 ? (b/1e6).toFixed(b >= 1e8 ? 0 : 1)+' MB' : Math.round(b/1e3)+' KB';
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const icon = (id) => `<svg class="i"><use href="#${id}"/></svg>`;
const SRC = { spotify: ['i-spotify', 'Spotify'], media: ['i-youtube', 'YouTube / web'], csv: ['i-file', 'Exportify CSV'], search: ['i-search', 'Search'] };
let pending = null;        // request waiting in the confirm sheet
let detailsId = null;      // job shown in the details modal
const JOBS = {};           // latest job rows by id

// ---- options (defaults, persisted) -------------------------------------------
const DEFAULTS = { format: 'mp3', bitrate: 320, numbered: true };
function loadOpts() { try { return { ...DEFAULTS, ...JSON.parse(localStorage.getItem('reprise.opts') || '{}') }; } catch { return { ...DEFAULTS }; } }
function opts() { return loadOpts(); }
function openOptions() {
  const o = loadOpts();
  $('bitrate').value = o.bitrate; $('format').value = o.format; $('numbered').checked = o.numbered;
  $('options').classList.add('show');
}
function closeOptions() {
  const o = { format: $('format').value, bitrate: +$('bitrate').value, numbered: $('numbered').checked };
  localStorage.setItem('reprise.opts', JSON.stringify(o));
  $('options').classList.remove('show');
  if (pending) { Object.assign(pending, o); renderConfirmOpts(); }
}
const optsSummary = (o) => `${o.format.toUpperCase()} · ${o.bitrate} kbps · ${o.numbered ? 'numbered in playlist order' : 'not numbered'}`;

// ---- api --------------------------------------------------------------------
async function api(path, o) {
  const r = await fetch(path, o);
  if (r.status === 401) { $('login').classList.add('show'); throw new Error('auth'); }
  return r;
}
async function detailOf(r) { try { return (await r.json()).detail || 'something went wrong'; } catch { return 'something went wrong'; } }
async function doLogin() {
  $('loginErr').textContent = '';
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ password: $('pw').value }) });
    if (r.ok) { $('login').classList.remove('show'); $('pw').value = ''; refresh(); }
    else $('loginErr').textContent = await detailOf(r);
  } catch { $('loginErr').textContent = 'network error — is the server up?'; }
}

// ---- request flow: look up, confirm if it's more than one song ---------------
let slowTimer = null;
function busy(on) {
  $('goBtn').disabled = on;
  $('goBtn').innerHTML = on ? '<span class="spin"></span>' : icon('i-arrow');
  clearTimeout(slowTimer);
  $('subErr').classList.remove('soft');
  if (on) slowTimer = setTimeout(() => { $('subErr').classList.add('soft'); $('subErr').textContent = 'Still looking up — big playlists can take a minute or two.'; }, 8000);
}
function fail(msg) { $('subErr').classList.remove('soft'); $('subErr').textContent = msg; }

async function submit() {
  const input = $('input').value.trim();
  if (!input || $('goBtn').disabled) return;
  fail(''); busy(true);
  try {
    const o = opts();
    const r = await api('/api/preflight', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ input, ...o }) });
    if (!r.ok) { fail(await detailOf(r)); return; }
    const p = await r.json();
    fail('');
    pending = { kind: 'link', input, token: p.token, title: p.title, ...o };
    if (p.count > 1) showConfirm(p); else await confirmGo();
  } catch (e) { if (e.message !== 'auth') fail('network error'); }
  finally { busy(false); }
}

async function uploadCsv(file) {
  if ($('goBtn').disabled) return;
  fail(''); busy(true);
  try {
    const o = opts();
    const fd = new FormData(); fd.append('file', file);
    const r = await api(`/api/jobs/csv?dry_run=1&format=${o.format}&bitrate=${o.bitrate}`, { method: 'POST', body: fd });
    if (!r.ok) { fail(await detailOf(r)); return; }
    const p = await r.json();
    fail('');
    pending = { kind: 'csv', file, ...o };
    if (p.count > 1) showConfirm(p); else await confirmGo();
  } catch (e) { if (e.message !== 'auth') fail('network error'); }
  finally { busy(false); }
}

function showConfirm(p) {
  $('cTitle').textContent = p.title;
  $('cSub').textContent = `${plural(p.count, 'song')} · about ${p.est_mb} MB`;
  $('cTracks').innerHTML = p.tracks.slice(0, 12).map(t => `<li>${esc(t)}</li>`).join('')
    + (p.count > 12 ? `<li style="list-style:none;margin-left:-20px">… and ${p.count - 12} more</li>` : '');
  renderConfirmOpts();
  $('confirm').classList.add('show');
}
function renderConfirmOpts() {
  if (!pending) return;
  $('cOpts').innerHTML = `${esc(optsSummary(pending))} · <button class="linkish" onclick="openOptions()">change</button>`;
}
function closeConfirm() { $('confirm').classList.remove('show'); pending = null; }

async function confirmGo() {
  if (!pending) return;
  const p = pending; pending = null;
  $('confirm').classList.remove('show');
  try {
    let r;
    if (p.kind === 'csv') {
      const fd = new FormData(); fd.append('file', p.file);
      r = await api(`/api/jobs/csv?format=${p.format}&bitrate=${p.bitrate}&numbered=${p.numbered ? 1 : 0}`, { method: 'POST', body: fd });
    } else {
      r = await api('/api/jobs', { method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ input: p.input, token: p.token, title: p.title, format: p.format, bitrate: p.bitrate, numbered: p.numbered }) });
    }
    if (r.ok) { $('input').value = ''; refresh(); } else fail(await detailOf(r));
  } catch (e) { if (e.message !== 'auth') fail('network error'); }
}

// page-wide CSV drop target
$('csvfile').onchange = (e) => { if (e.target.files[0]) uploadCsv(e.target.files[0]); e.target.value = ''; };
let dragDepth = 0;
document.addEventListener('dragenter', e => { if (e.dataTransfer?.types.includes('Files')) { dragDepth++; document.body.classList.add('dragging'); } });
document.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); } });
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => { e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging'); const f = e.dataTransfer.files[0]; if (f) uploadCsv(f); });
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($('options').classList.contains('show')) closeOptions();
  else if (detailsId) closeDetails();
  else if (pending) closeConfirm();
});

// ---- job cards -----------------------------------------------------------------
async function act(id, method, path, confirmMsg) {
  if (confirmMsg && !confirm(confirmMsg)) return;
  try { const r = await api(`/api/jobs/${id}${path}`, { method }); if (!r.ok) alert(await detailOf(r)); } catch {}
  refresh();
}
async function tryAgain(id) {
  const j = JOBS[id]; if (!j) return;
  try { const r = await api(`/api/jobs/${id}/retry`, { method: 'POST' }); if (r.ok) { refresh(); return; } } catch (e) { if (e.message === 'auth') return; }
  if (!j.input) return;
  try {
    await api('/api/jobs', { method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ input: j.input, format: j.format, bitrate: j.bitrate, numbered: !!j.numbered }) });
    await api(`/api/jobs/${id}`, { method: 'DELETE' });
  } catch {}
  refresh();
}

function stateLine(j) {
  const multi = (j.total || 0) > 1;
  switch (j.status) {
    case 'queued': return ['', 'Waiting…'];
    case 'running':
      if (j.step === 'resolving') return ['', '<span class="spin"></span>Looking up tracks…'];
      if (j.step === 'finishing') return ['', '<span class="spin"></span>Finishing up…'];
      return ['', j.total ? `Downloading · ${j.done} of ${j.total}` : 'Downloading…'];
    case 'retrying': return ['', '<span class="spin"></span>Retrying the missing ones…'];
    case 'done': return ['ok', `Ready${multi ? ' · ' + plural(j.files_count, 'song') : ''} · ${mb(j.size_bytes)}`];
    case 'done_with_errors': return ['warn', `Ready · ${plural(j.files_count, 'song')} · <b>${plural(j.missing.length, 'song')} couldn't be found</b>`];
    case 'cancelled': return ['', 'Cancelled'];
    case 'interrupted': return ['bad', 'Interrupted — the server restarted'];
    default: return ['bad', `Couldn't download — ${esc(j.error || 'unknown error')}`];
  }
}

function card(j, d) {
  const active = ['running', 'queued', 'retrying'].includes(j.status);
  const ready = j.status === 'done' || j.status === 'done_with_errors';
  const multi = (j.total || 0) > 1 || j.files_count > 1;
  const [cls, line] = stateLine(j);
  const pct = j.total ? Math.min(100, Math.round(100 * j.done / j.total)) : null;
  const bar = (j.status === 'running' && j.step === 'downloading') ? `<div class="bar ${pct === null ? 'indet' : ''}"><i style="width:${pct ?? 30}%"></i></div>` : '';
  const [srcIcon, srcLabel] = SRC[j.kind] || ['i-search', j.kind];
  let primary = '';
  if (ready && !multi && d && d.files.length === 1) primary = `<a class="btn" href="/api/jobs/${j.id}/files/${encodeURIComponent(d.files[0].name)}"><button>Download</button></a>`;
  else if (ready) primary = `<a class="btn" href="/api/jobs/${j.id}/zip"><button>Download</button></a>`;
  const retry = j.status === 'done_with_errors' ? `<button class="ghost" onclick="act('${j.id}','POST','/retry')">Retry missing</button>` : '';
  const again = ['error', 'interrupted', 'cancelled'].includes(j.status) ? `<button class="ghost" onclick="tryAgain('${j.id}')">Try again</button>` : '';
  const cancel = active ? `<button class="ghost" onclick="act('${j.id}','POST','/cancel')">Cancel</button>` : '';
  const remove = !active ? `<button class="ibtn danger" title="Remove" aria-label="Remove" onclick="act('${j.id}','DELETE','', 'Remove this download and its files?')">${icon('i-trash')}</button>` : '';
  const missing = (j.status === 'done_with_errors' && j.missing.length)
    ? `<div class="missing">Couldn't find:<ul>${j.missing.map(m => `<li>${esc(m)}</li>`).join('')}</ul></div>` : '';
  const cover = j.cover
    ? `<img class="cover" src="${esc(j.cover)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.replaceWith(coverFallback('${srcIcon}'))">`
    : `<div class="cover">${icon(srcIcon)}</div>`;
  return `<div class="card job">${cover}<div class="body">
    <div class="job-head"><div class="job-title">${esc(j.title)}</div>${
      /^https?:\/\//.test(j.input || '')
        ? `<a class="src" href="${esc(j.input)}" target="_blank" rel="noopener" title="Open on ${j.kind === 'spotify' ? 'Spotify' : /youtu\.?be/.test(j.input) ? 'YouTube' : 'the source site'}">${icon(srcIcon)}</a>`
        : `<span class="src" title="${srcLabel}">${icon(srcIcon)}</span>`}</div>
    <div class="state ${cls}">${line}</div>
    ${bar}${missing}
    <div class="actions">${primary}${retry}${again}${cancel}<span class="spacer"></span>
      <button class="ibtn" title="Details" aria-label="Details" onclick="openDetails('${j.id}')">${icon('i-info')}</button>${remove}
    </div>
  </div></div>`;
}
function coverFallback(iconId) { const d = document.createElement('div'); d.className = 'cover'; d.innerHTML = icon(iconId); return d; }

// ---- details modal --------------------------------------------------------------
async function openDetails(id) { detailsId = id; $('details').classList.add('show'); await renderDetails(); }
function closeDetails() { detailsId = null; $('details').classList.remove('show'); }
async function renderDetails() {
  if (!detailsId) return;
  let d; try { d = await (await api('/api/jobs/' + detailsId)).json(); } catch { return; }
  if (!detailsId) return;
  const [, srcLabel] = SRC[d.kind] || ['', d.kind];
  const requested = d.input
    ? (/^https?:\/\//.test(d.input) ? `<a href="${esc(d.input)}" target="_blank" rel="noopener">${esc(d.input)}</a>` : `“${esc(d.input)}”`)
    : (d.kind === 'csv' ? `Exportify CSV · ${esc(d.title)}.csv` : '—');
  $('dTitle').textContent = d.title;
  $('dMeta').innerHTML = `<dt>Requested</dt><dd>${requested}</dd>
    <dt>Source</dt><dd>${esc(srcLabel)}</dd>
    <dt>Format</dt><dd>${esc(d.format.toUpperCase())} · ${d.bitrate} kbps${d.numbered ? ' · numbered' : ''}</dd>
    <dt>Requested at</dt><dd>${new Date(d.created * 1000).toLocaleString()}</dd>
    ${d.finished ? `<dt>${({ cancelled: 'Cancelled at', error: 'Failed at', interrupted: 'Interrupted at' })[d.status] || 'Completed at'}</dt><dd>${new Date(d.finished * 1000).toLocaleString()}</dd>` : ''}
    ${d.keep_until ? `<dt>Kept until</dt><dd>${new Date(d.keep_until * 1000).toLocaleString()}</dd>` : ''}`;
  $('dFiles').innerHTML = d.files.map(f => `<div class="file"><a href="/api/jobs/${d.id}/files/${encodeURIComponent(f.name)}">${esc(f.name)}</a><span>${mb(f.size)}</span></div>`).join('');
  $('dLog').textContent = d.log || '(no output yet)';
}

// ---- polling ---------------------------------------------------------------------
let seq = 0;
const singleCache = {};
async function refresh() {
  const my = ++seq;
  let data;
  try { data = await (await api('/api/jobs')).json(); } catch { return; }
  if (my !== seq) return;
  const details = {};
  await Promise.all(data.jobs.filter(j => (j.status === 'done' || j.status === 'done_with_errors') && j.files_count === 1 && (j.total || 0) <= 1)
    .map(async j => {
      const c = singleCache[j.id];
      if (c && c.finished === j.finished) { details[j.id] = c.detail; return; }
      try { const d = await (await api('/api/jobs/' + j.id)).json(); details[j.id] = d; singleCache[j.id] = { finished: j.finished, detail: d }; } catch {}
    }));
  if (my !== seq) return;
  for (const k in JOBS) delete JOBS[k];
  data.jobs.forEach(j => JOBS[j.id] = j);
  $('jobs').innerHTML = data.jobs.length ? data.jobs.map(j => card(j, details[j.id])).join('') : '<div class="empty">Nothing yet — paste a link above.</div>';
  const active = data.jobs.filter(j => j.status === 'running' || j.status === 'retrying').length;
  document.title = active ? `(${active}) Reprise` : 'Reprise';
  $('foot').textContent = `Downloads are kept for ${data.keep_days} day${data.keep_days == 1 ? '' : 's'} · ${mb(data.disk_used)} used`;
  if (detailsId && JOBS[detailsId] && ['running', 'retrying', 'queued'].includes(JOBS[detailsId].status)) renderDetails();
}

refresh();
setInterval(refresh, 2000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
</script>
</body>
</html>
