<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reprise</title>
<style>
  :root {
    --bg: #0f1117; --panel: #171a23; --panel2: #1e2230; --line: #2a2f40;
    --text: #e6e9f2; --dim: #8b91a7; --accent: #7c8cff; --accent2: #5865f2;
    --ok: #4ade80; --warn: #fbbf24; --err: #f87171; --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--text); min-height: 100vh;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 32px 20px 80px; }
  header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 28px; }
  header h1 { font-size: 26px; letter-spacing: -0.5px; }
  header h1 span { color: var(--accent); }
  header p { color: var(--dim); font-size: 13px; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }

  .submit { padding: 18px; margin-bottom: 14px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row input[type=text] { flex: 1 1 260px; }
  input[type=text], input[type=password], select {
    background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 11px 14px; font-size: 15px; outline: none;
  }
  input[type=text]:focus, input[type=password]:focus { border-color: var(--accent); }
  input[type=text] { flex: 1; min-width: 0; }
  button {
    background: var(--accent2); color: #fff; border: 0; border-radius: 8px;
    padding: 11px 20px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  button:hover { filter: brightness(1.1); }
  button.ghost { background: transparent; color: var(--dim); border: 1px solid var(--line); font-weight: 400; padding: 6px 12px; font-size: 13px; }
  button.ghost:hover { color: var(--text); border-color: var(--dim); filter: none; }
  .hint { color: var(--dim); font-size: 12.5px; margin-top: 10px; }

  .drop {
    margin-top: 12px; border: 1.5px dashed var(--line); border-radius: 8px;
    padding: 14px; text-align: center; color: var(--dim); font-size: 13.5px; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .drop.hover, .drop:hover { border-color: var(--accent); background: rgba(124,140,255,.05); }

  .job { padding: 16px 18px; margin-bottom: 10px; }
  .job-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .job-title { font-weight: 600; overflow-wrap: anywhere; flex: 1; min-width: 200px; }
  .badge { font-size: 11px; padding: 2.5px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); text-transform: uppercase; letter-spacing: .4px; }
  .chip { font-size: 12px; padding: 3px 10px; border-radius: 999px; font-weight: 600; }
  .chip.queued { background: #2a2f40; color: var(--dim); }
  .chip.running { background: rgba(124,140,255,.15); color: var(--accent); }
  .chip.done { background: rgba(74,222,128,.12); color: var(--ok); }
  .chip.done_with_errors { background: rgba(251,191,36,.12); color: var(--warn); }
  .chip.error, .chip.interrupted { background: rgba(248,113,113,.12); color: var(--err); }
  .chip.cancelled { background: #2a2f40; color: var(--dim); }

  .bar { height: 5px; background: var(--panel2); border-radius: 999px; margin: 12px 0 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .5s; }
  .bar.indet i { width: 30% !important; animation: slide 1.2s ease-in-out infinite alternate; }
  @keyframes slide { from { margin-left: 0 } to { margin-left: 70% } }
  .meta { color: var(--dim); font-size: 12.5px; display: flex; gap: 14px; flex-wrap: wrap; }

  .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  details { margin-top: 10px; }
  summary { color: var(--dim); font-size: 13px; cursor: pointer; user-select: none; }
  pre {
    background: #0b0d12; border: 1px solid var(--line); border-radius: 8px;
    padding: 12px; font-size: 12px; line-height: 1.45; overflow-x: auto;
    max-height: 260px; overflow-y: auto; margin-top: 8px; color: #aab2c8;
  }
  .files { margin-top: 10px; display: grid; gap: 4px; }
  .file { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; padding: 7px 10px; background: var(--panel2); border-radius: 7px; }
  .file a { color: var(--accent); text-decoration: none; overflow-wrap: anywhere; }
  .file a:hover { text-decoration: underline; }
  .file span { color: var(--dim); white-space: nowrap; }

  .empty { text-align: center; color: var(--dim); padding: 40px 0; font-size: 14px; }

  #login { position: fixed; inset: 0; background: var(--bg); display: none; place-items: center; z-index: 10; }
  #login .card { padding: 32px; width: 320px; display: grid; gap: 12px; }
  #login h2 { font-size: 20px; }
  #loginErr { color: var(--err); font-size: 13px; min-height: 18px; }
</style>
</head>
<body>
<div id="login"><div class="card">
  <h2>Reprise</h2>
  <input type="password" id="pw" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()" style="width:100%" autocomplete="current-password">
  <div id="loginErr"></div>
  <button onclick="doLogin()">Sign in</button>
</div></div>

<div class="wrap">
  <header>
    <h1>Re<span>prise</span></h1>
    <p>Spotify playlists &amp; YouTube &rarr; your files</p>
  </header>

  <div class="card submit">
    <div class="row">
      <input type="text" id="input" placeholder="Spotify or YouTube URL, or search — e.g. a playlist link"
             onkeydown="if(event.key==='Enter')submit()">
      <select id="format">
        <option value="mp3" selected>MP3 · 320k</option>
        <option value="m4a">M4A</option>
        <option value="opus">Opus</option>
        <option value="flac">FLAC</option>
      </select>
      <button onclick="submit()">Download</button>
    </div>
    <div class="drop" id="drop">or drop an <b>Exportify CSV</b> here (works for private playlists)</div>
    <input type="file" id="csvfile" accept=".csv" style="display:none">
    <div class="hint">Spotify links: track / album / playlist / artist. YouTube: video or playlist. Anything else is treated as a search.</div>
  </div>

  <div id="jobs"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const fmtSize = (b) => b > 1048576 ? (b/1048576).toFixed(1)+' MB' : Math.round(b/1024)+' KB';
const esc = (s) => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let openJobs = new Set();

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (r.status === 401) { $('login').style.display = 'grid'; throw new Error('auth'); }
  return r;
}

async function doLogin() {
  $('loginErr').textContent = '';
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ password: $('pw').value }) });
    if (r.ok) { $('login').style.display = 'none'; $('pw').value = ''; refresh(); }
    else $('loginErr').textContent = (await r.json()).detail || 'login failed';
  } catch { $('loginErr').textContent = 'network error — is the server up?'; }
}

async function submit() {
  const input = $('input').value.trim();
  if (!input) return;
  try {
    const r = await api('/api/jobs', { method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ input, format: $('format').value }) });
    if (r.ok) { $('input').value = ''; refresh(); }
    else alert((await r.json()).detail || 'failed');
  } catch (e) { if (e.message !== 'auth') alert('network error'); }
}

async function uploadCsv(file) {
  const fd = new FormData();
  fd.append('file', file);
  try {
    const r = await api('/api/jobs/csv?format=' + $('format').value, { method: 'POST', body: fd });
    if (r.ok) refresh();
    else alert((await r.json()).detail || 'CSV upload failed');
  } catch (e) { if (e.message !== 'auth') alert('network error'); }
}

const drop = $('drop');
drop.onclick = () => $('csvfile').click();
$('csvfile').onchange = (e) => { if (e.target.files[0]) uploadCsv(e.target.files[0]); e.target.value = ''; };
['dragover','dragenter'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('hover'); }));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('hover'); }));
drop.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) uploadCsv(f); });

async function jobAction(id, method, path, confirmMsg) {
  if (confirmMsg && !confirm(confirmMsg)) return;
  await api(`/api/jobs/${id}${path}`, { method });
  refresh();
}

function jobCard(j, detail) {
  const running = j.status === 'running';
  const pct = j.total ? Math.min(100, Math.round(100 * j.done / j.total)) : null;
  const kindLabel = { spotify: 'spotify', csv: 'csv', search: 'search', media: 'yt-dlp' }[j.kind] || j.kind;
  const age = new Date(j.created * 1000).toLocaleString();
  let bar = '';
  if (running || j.status === 'queued') {
    bar = `<div class="bar ${pct === null ? 'indet' : ''}"><i style="width:${pct ?? 30}%"></i></div>`;
  }
  let filesHtml = '';
  if (detail && detail.files.length) {
    filesHtml = '<div class="files">' + detail.files.map(f =>
      `<div class="file"><a href="/api/jobs/${j.id}/files/${encodeURIComponent(f.name)}">${esc(f.name)}</a><span>${fmtSize(f.size)}</span></div>`
    ).join('') + '</div>';
  }
  const logHtml = detail && detail.log ? `<pre>${esc(detail.log)}</pre>` : '';
  const zipBtn = (j.files > 1) ? `<a href="/api/jobs/${j.id}/zip"><button class="ghost">Zip all</button></a>` : '';
  const cancelBtn = (running || j.status === 'queued') ? `<button class="ghost" onclick="jobAction('${j.id}','POST','/cancel')">Cancel</button>` : '';
  const rmBtn = (!running) ? `<button class="ghost" onclick="jobAction('${j.id}','DELETE','', 'Remove this job from the list? (files are kept)')">Remove</button>` : '';
  return `<div class="card job" id="job-${j.id}">
    <div class="job-head">
      <div class="job-title">${esc(j.title)}</div>
      <span class="badge">${kindLabel}</span>
      <span class="chip ${j.status}">${j.status.replace(/_/g,' ')}</span>
    </div>
    ${bar}
    <div class="meta">
      <span>${j.total ? `${j.done}/${j.total} tracks` : (j.files ? `${j.files} file${j.files>1?'s':''}` : '')}</span>
      <span>${j.format}</span><span>${age}</span>
      ${j.error ? `<span style="color:var(--err)">${esc(j.error)}</span>` : ''}
    </div>
    <div class="actions">${zipBtn}${cancelBtn}${rmBtn}
      <button class="ghost" onclick="toggleDetail('${j.id}')">${openJobs.has(j.id) ? 'Hide' : 'Details'}</button>
    </div>
    ${openJobs.has(j.id) ? filesHtml + logHtml : ''}
  </div>`;
}

function toggleDetail(id) {
  openJobs.has(id) ? openJobs.delete(id) : openJobs.add(id);
  refresh();
}

let refreshSeq = 0;
async function refresh() {
  const mySeq = ++refreshSeq;
  let data;
  try {
    const r = await api('/api/jobs');
    data = await r.json();
  } catch { return; }
  if (mySeq !== refreshSeq) return; // a newer poll superseded this one
  const details = {};
  await Promise.all([...openJobs].map(async id => {
    try { details[id] = await (await api('/api/jobs/' + id)).json(); } catch {}
  }));
  if (mySeq !== refreshSeq) return;
  const el = $('jobs');
  if (!data.jobs.length) {
    el.innerHTML = '<div class="empty">No downloads yet — paste a link above to get started.</div>';
    return;
  }
  el.innerHTML = data.jobs.map(j => jobCard(j, details[j.id])).join('');
}

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
