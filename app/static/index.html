<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reprise</title>
<meta name="theme-color" content="#0f1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reprise">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<style>
  :root {
    --bg: #0f1117; --panel: #171a23; --panel2: #1e2230; --line: #2a2f40;
    --text: #e6e9f2; --dim: #8b91a7; --accent: #7c8cff; --accent2: #5865f2;
    --ok: #4ade80; --warn: #fbbf24; --err: #f87171; --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg); color: var(--text); min-height: 100vh;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 28px 18px 60px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  header img { width: 34px; height: 34px; border-radius: 9px; }
  header h1 { font-size: 24px; letter-spacing: -0.4px; }
  header p { color: var(--dim); font-size: 13px; margin-left: auto; text-align: right; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }

  .submit { padding: 16px; margin-bottom: 18px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row input[type=text] { flex: 1 1 240px; }
  input[type=text], input[type=password], select {
    background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px 14px; font-size: 16px; outline: none; min-width: 0;
  }
  input:focus, select:focus { border-color: var(--accent); }
  button {
    background: var(--accent2); color: #fff; border: 0; border-radius: 10px;
    padding: 12px 20px; font-size: 15px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  button:hover { filter: brightness(1.1); }
  button:disabled { opacity: .5; cursor: default; filter: none; }
  button.ghost { background: transparent; color: var(--dim); border: 1px solid var(--line); font-weight: 500; padding: 7px 13px; font-size: 13px; }
  button.ghost:hover { color: var(--text); border-color: var(--dim); filter: none; }
  button.ghost.danger:hover { color: var(--err); border-color: var(--err); }
  a.btn { text-decoration: none; display: inline-block; }
  .err { color: var(--err); font-size: 13.5px; margin-top: 10px; min-height: 0; }

  details.opts { margin-top: 12px; }
  details.opts summary { color: var(--dim); font-size: 13px; cursor: pointer; user-select: none; list-style: none; }
  details.opts summary::before { content: "▸ "; }
  details.opts[open] summary::before { content: "▾ "; }
  .optgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-top: 10px; }
  .opt label { display: block; color: var(--dim); font-size: 12px; margin-bottom: 4px; }
  .opt select { width: 100%; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 14px; padding-top: 20px; }

  .drop {
    margin-top: 12px; border: 1.5px dashed var(--line); border-radius: 10px;
    padding: 13px; text-align: center; color: var(--dim); font-size: 13.5px; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .drop.hover, .drop:hover { border-color: var(--accent); background: rgba(124,140,255,.05); }

  .job { padding: 15px 17px; margin-bottom: 10px; }
  .job-head { display: flex; align-items: flex-start; gap: 10px; }
  .job-title { font-weight: 600; overflow-wrap: anywhere; flex: 1; line-height: 1.35; }
  .badge { font-size: 11px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); white-space: nowrap; margin-top: 2px; }
  .state { margin-top: 6px; font-size: 14px; color: var(--dim); }
  .state.ok { color: var(--ok); }
  .state.warn { color: var(--warn); }
  .state.bad { color: var(--err); }
  .state .dim { color: var(--dim); }

  .bar { height: 5px; background: var(--panel2); border-radius: 999px; margin: 10px 0 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .5s; }
  .bar.indet i { width: 30% !important; animation: slide 1.2s ease-in-out infinite alternate; }
  @keyframes slide { from { margin-left: 0 } to { margin-left: 70% } }

  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
  .actions .spacer { flex: 1; }
  .link { background: none; border: 0; color: var(--dim); font-size: 13px; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; font-weight: 400; }
  .link:hover { color: var(--text); filter: none; }

  .missing { margin-top: 10px; font-size: 13.5px; }
  .missing ul { margin: 6px 0 0 18px; color: var(--dim); }
  pre {
    background: #0b0d12; border: 1px solid var(--line); border-radius: 8px;
    padding: 12px; font-size: 12px; line-height: 1.45; overflow: auto;
    max-height: 240px; margin-top: 8px; color: #aab2c8;
  }
  .files { margin-top: 10px; display: grid; gap: 4px; }
  .file { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; padding: 7px 10px; background: var(--panel2); border-radius: 7px; }
  .file a { color: var(--accent); text-decoration: none; overflow-wrap: anywhere; }
  .file a:hover { text-decoration: underline; }
  .file span { color: var(--dim); white-space: nowrap; }

  .empty { text-align: center; color: var(--dim); padding: 40px 0; font-size: 14px; }
  footer { text-align: center; color: var(--dim); font-size: 12.5px; margin-top: 28px; }

  .overlay { position: fixed; inset: 0; background: rgba(15,17,23,.82); display: none; place-items: center; z-index: 10; padding: 18px; backdrop-filter: blur(4px); }
  .overlay.show { display: grid; }
  .sheet { padding: 24px; width: min(520px, 100%); display: grid; gap: 12px; }
  .sheet h2 { font-size: 19px; line-height: 1.3; }
  .sheet .sub { color: var(--dim); font-size: 14px; }
  .sheet ol { margin: 4px 0 0 20px; color: var(--dim); font-size: 13.5px; max-height: 180px; overflow: auto; }
  .sheet .btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  #loginErr { color: var(--err); font-size: 13px; min-height: 18px; }
  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: rot .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes rot { to { transform: rotate(360deg) } }
</style>
</head>
<body>

<div class="overlay" id="login"><div class="card sheet" style="width:min(340px,100%)">
  <h2>Reprise</h2>
  <input type="password" id="pw" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
  <div id="loginErr"></div>
  <button onclick="doLogin()">Sign in</button>
</div></div>

<div class="overlay" id="confirm"><div class="card sheet">
  <h2 id="cTitle"></h2>
  <div class="sub" id="cSub"></div>
  <ol id="cTracks"></ol>
  <div class="sub" id="cOpts"></div>
  <div class="btns">
    <button class="ghost" onclick="closeConfirm()">Cancel</button>
    <button id="cGo" onclick="confirmGo()">Download</button>
  </div>
</div></div>

<div class="wrap">
  <header>
    <img src="/static/icon.svg" alt="">
    <h1>Reprise</h1>
    <p>Spotify &amp; YouTube<br>→ MP3</p>
  </header>

  <div class="card submit">
    <div class="row">
      <input type="text" id="input" placeholder="Paste a Spotify or YouTube link, or search…"
             autocomplete="off" autocapitalize="off" onkeydown="if(event.key==='Enter')submit()">
      <button id="goBtn" onclick="submit()">Download</button>
    </div>
    <div class="err" id="subErr"></div>
    <details class="opts">
      <summary>Options</summary>
      <div class="optgrid">
        <div class="opt"><label>Quality</label>
          <select id="bitrate">
            <option value="320" selected>Best · 320 kbps</option>
            <option value="192">Compact · 192 kbps</option>
            <option value="128">Smallest · 128 kbps</option>
          </select></div>
        <div class="opt"><label>Format</label>
          <select id="format">
            <option value="mp3" selected>MP3</option>
            <option value="m4a">M4A</option>
            <option value="opus">Opus</option>
            <option value="flac">FLAC</option>
          </select></div>
        <label class="check"><input type="checkbox" id="numbered" checked> Number tracks in playlist order</label>
      </div>
    </details>
    <div class="drop" id="drop">or drop an <b>Exportify CSV</b> here · for private playlists</div>
    <input type="file" id="csvfile" accept=".csv,text/csv" style="display:none">
  </div>

  <div id="jobs"></div>
  <footer id="foot"></footer>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mb = (b) => b >= 1e9 ? (b/1e9).toFixed(2)+' GB' : b >= 1e6 ? (b/1e6).toFixed(b >= 1e8 ? 0 : 1)+' MB' : Math.round(b/1e3)+' KB';
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
let openDetails = new Set();
let pending = null; // {kind:'link'|'csv', ...} waiting in the confirm sheet

function opts() {
  return { format: $('format').value, bitrate: +$('bitrate').value, numbered: $('numbered').checked };
}

async function api(path, o) {
  const r = await fetch(path, o);
  if (r.status === 401) { $('login').classList.add('show'); throw new Error('auth'); }
  return r;
}
async function detailOf(r) { try { return (await r.json()).detail || 'something went wrong'; } catch { return 'something went wrong'; } }

async function doLogin() {
  $('loginErr').textContent = '';
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ password: $('pw').value }) });
    if (r.ok) { $('login').classList.remove('show'); $('pw').value = ''; refresh(); }
    else $('loginErr').textContent = await detailOf(r);
  } catch { $('loginErr').textContent = 'network error — is the server up?'; }
}

// ---- submit flow: look up first, confirm if it's more than one song --------
let slowTimer = null;
function busy(on) {
  $('goBtn').disabled = on;
  $('goBtn').innerHTML = on ? '<span class="spin"></span>Looking up' : 'Download';
  clearTimeout(slowTimer);
  if (on) slowTimer = setTimeout(() => { $('subErr').style.color = 'var(--dim)'; $('subErr').textContent = 'Still looking up — big playlists can take a minute or two.'; }, 8000);
  else { $('subErr').style.color = ''; }
}

async function submit() {
  const input = $('input').value.trim();
  if (!input) return;
  $('subErr').textContent = '';
  busy(true);
  try {
    const o = opts();
    const r = await api('/api/preflight', { method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ input, ...o }) });
    if (!r.ok) { $('subErr').textContent = await detailOf(r); return; }
    const p = await r.json();
    $('subErr').textContent = '';
    pending = { kind: 'link', input, token: p.token, title: p.title, ...o };
    if (p.count > 1) showConfirm(p);
    else await confirmGo();
  } catch (e) { if (e.message !== 'auth') $('subErr').textContent = 'network error'; }
  finally { busy(false); }
}

async function uploadCsv(file) {
  $('subErr').textContent = '';
  busy(true);
  try {
    const o = opts();
    const fd = new FormData(); fd.append('file', file);
    const r = await api(`/api/jobs/csv?dry_run=1&format=${o.format}&bitrate=${o.bitrate}`, { method: 'POST', body: fd });
    if (!r.ok) { $('subErr').textContent = await detailOf(r); return; }
    const p = await r.json();
    pending = { kind: 'csv', file, ...o };
    if (p.count > 1) showConfirm(p); else await confirmGo();
  } catch (e) { if (e.message !== 'auth') $('subErr').textContent = 'network error'; }
  finally { busy(false); }
}

function showConfirm(p) {
  $('cTitle').textContent = p.title;
  $('cSub').textContent = `${plural(p.count, 'song')} · about ${p.est_mb} MB at ${pending.bitrate} kbps`;
  const list = p.tracks.slice(0, 12).map(t => `<li>${esc(t)}</li>`).join('');
  $('cTracks').innerHTML = list + (p.count > 12 ? `<li style="list-style:none;margin-left:-20px">… and ${p.count - 12} more</li>` : '');
  $('cOpts').textContent = `${pending.format.toUpperCase()} · ${pending.numbered ? 'numbered in playlist order' : 'not numbered'} — change under Options`;
  $('confirm').classList.add('show');
}
function closeConfirm() { $('confirm').classList.remove('show'); pending = null; }

async function confirmGo() {
  if (!pending) return;
  const p = pending; pending = null;
  $('confirm').classList.remove('show');
  try {
    let r;
    if (p.kind === 'csv') {
      const fd = new FormData(); fd.append('file', p.file);
      r = await api(`/api/jobs/csv?format=${p.format}&bitrate=${p.bitrate}&numbered=${p.numbered ? 1 : 0}`, { method: 'POST', body: fd });
    } else {
      r = await api('/api/jobs', { method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ input: p.input, token: p.token, title: p.title, format: p.format, bitrate: p.bitrate, numbered: p.numbered }) });
    }
    if (r.ok) { $('input').value = ''; refresh(); }
    else $('subErr').textContent = await detailOf(r);
  } catch (e) { if (e.message !== 'auth') $('subErr').textContent = 'network error'; }
}

const drop = $('drop');
drop.onclick = () => $('csvfile').click();
$('csvfile').onchange = (e) => { if (e.target.files[0]) uploadCsv(e.target.files[0]); e.target.value = ''; };
['dragover','dragenter'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('hover'); }));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('hover'); }));
drop.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) uploadCsv(f); });

// ---- job cards ---------------------------------------------------------------
async function act(id, method, path, confirmMsg) {
  if (confirmMsg && !confirm(confirmMsg)) return;
  try {
    const r = await api(`/api/jobs/${id}${path}`, { method });
    if (!r.ok) alert(await detailOf(r));
  } catch {}
  refresh();
}
async function tryAgain(j) {
  // errored/interrupted jobs without a track list: just resubmit the same input
  try {
    await api('/api/jobs', { method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ input: j.input, format: j.format, bitrate: j.bitrate, numbered: !!j.numbered }) });
    await api(`/api/jobs/${j.id}`, { method: 'DELETE' });
  } catch {}
  refresh();
}

function stateLine(j) {
  const multi = (j.total || 0) > 1;
  const songs = (n) => multi ? plural(n, 'song') : '';
  switch (j.status) {
    case 'queued': return ['', 'Waiting…'];
    case 'running':
      if (j.step === 'resolving') return ['', '<span class="spin"></span>Looking up tracks…'];
      if (j.step === 'finishing') return ['', '<span class="spin"></span>Finishing up…'];
      return ['', j.total ? `Downloading · ${j.done} of ${j.total}` : 'Downloading…'];
    case 'retrying': return ['', '<span class="spin"></span>Retrying the missing ones…'];
    case 'done':
      return ['ok', `Ready${multi ? ' · ' + songs(j.files_count) : ''} · ${mb(j.size_bytes)}`];
    case 'done_with_errors':
      return ['warn', `Ready · ${songs(j.files_count) || mb(j.size_bytes)} · <b>${plural(j.missing.length, 'song')} couldn't be found</b>`];
    case 'cancelled': return ['', 'Cancelled'];
    case 'interrupted': return ['bad', 'Interrupted — the server restarted'];
    default: return ['bad', `Couldn't download — ${esc(j.error || 'unknown error')}`];
  }
}

function card(j, d) {
  const active = j.status === 'running' || j.status === 'queued' || j.status === 'retrying';
  const ready = j.status === 'done' || j.status === 'done_with_errors';
  const multi = (j.total || 0) > 1 || j.files_count > 1;
  const [cls, line] = stateLine(j);
  const pct = j.total ? Math.min(100, Math.round(100 * j.done / j.total)) : null;
  const bar = (j.status === 'running' && j.step === 'downloading')
    ? `<div class="bar ${pct === null ? 'indet' : ''}"><i style="width:${pct ?? 30}%"></i></div>` : '';
  const kind = { spotify: 'Spotify', csv: 'Exportify', search: 'Search', media: 'YouTube' }[j.kind] || j.kind;

  let primary = '';
  if (ready && multi) primary = `<a class="btn" href="/api/jobs/${j.id}/zip"><button>Save to computer</button></a>`;
  else if (ready && d && d.files.length === 1) primary = `<a class="btn" href="/api/jobs/${j.id}/files/${encodeURIComponent(d.files[0].name)}"><button>Save to computer</button></a>`;
  else if (ready) primary = `<a class="btn" href="/api/jobs/${j.id}/zip"><button>Save to computer</button></a>`;

  const retry = j.status === 'done_with_errors' ? `<button class="ghost" onclick="act('${j.id}','POST','/retry')">Retry missing</button>` : '';
  const again = (j.status === 'error' || j.status === 'interrupted' || j.status === 'cancelled') && j.input
    ? `<button class="ghost" onclick='tryAgain(${JSON.stringify(j).replace(/'/g, "&#39;")})'>Try again</button>` : '';
  const cancel = active ? `<button class="ghost" onclick="act('${j.id}','POST','/cancel')">Cancel</button>` : '';
  const remove = !active ? `<button class="ghost danger" onclick="act('${j.id}','DELETE','', 'Remove this download and its files?')">Remove</button>` : '';

  let missing = '';
  if (j.status === 'done_with_errors' && j.missing.length) {
    missing = `<div class="missing">Couldn't find:<ul>${j.missing.map(m => `<li>${esc(m)}</li>`).join('')}</ul></div>`;
  }
  let details = '';
  if (openDetails.has(j.id) && d) {
    details = (d.files.length ? '<div class="files">' + d.files.map(f =>
      `<div class="file"><a href="/api/jobs/${j.id}/files/${encodeURIComponent(f.name)}">${esc(f.name)}</a><span>${mb(f.size)}</span></div>`).join('') + '</div>' : '')
      + (d.log ? `<pre>${esc(d.log)}</pre>` : '');
  }
  return `<div class="card job">
    <div class="job-head"><div class="job-title">${esc(j.title)}</div><span class="badge">${kind}</span></div>
    <div class="state ${cls}">${line}</div>
    ${bar}${missing}
    <div class="actions">${primary}${retry}${again}${cancel}<span class="spacer"></span>${remove}
      <button class="link" onclick="toggle('${j.id}')">${openDetails.has(j.id) ? 'hide details' : 'details'}</button>
    </div>
    ${details}
  </div>`;
}

function toggle(id) { openDetails.has(id) ? openDetails.delete(id) : openDetails.add(id); refresh(); }

let seq = 0;
async function refresh() {
  const my = ++seq;
  let data;
  try { data = await (await api('/api/jobs')).json(); } catch { return; }
  if (my !== seq) return;
  const details = {};
  await Promise.all([...openDetails].map(async id => {
    try { details[id] = await (await api('/api/jobs/' + id)).json(); } catch {}
  }));
  // single-file jobs need the filename for the direct link
  await Promise.all(data.jobs.filter(j => (j.status === 'done' || j.status === 'done_with_errors') && j.files_count === 1 && !details[j.id])
    .map(async j => { try { details[j.id] = await (await api('/api/jobs/' + j.id)).json(); } catch {} }));
  if (my !== seq) return;
  const el = $('jobs');
  el.innerHTML = data.jobs.length
    ? data.jobs.map(j => card(j, details[j.id])).join('')
    : '<div class="empty">Nothing yet — paste a link above.</div>';
  const active = data.jobs.filter(j => j.status === 'running' || j.status === 'retrying').length;
  document.title = active ? `(${active}) Reprise` : 'Reprise';
  $('foot').textContent = `Downloads are kept for ${data.keep_days} day${data.keep_days == 1 ? '' : 's'} · ${mb(data.disk_used)} used`;
}

refresh();
setInterval(refresh, 2000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
</script>
</body>
</html>
